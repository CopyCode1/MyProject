common:
  platform_allow: qemu_cortex_m3
  tags:
    - modem
    - at
  timeout: 30
tests:
  gt02.modem_at.session_recovery:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=0]
  gt02.modem_at.service_recovery:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=1]
  gt02.modem_at.recovery_off_failure:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=2]
  gt02.modem_at.recovery_missing_ready:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=3]
  gt02.modem_at.recovery_prepare_error:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=4]
  gt02.modem_at.recovery_on_failure:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=5]
  gt02.modem_at.recovery_budget:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=6]
  gt02.modem_at.recovery_rearm_failure:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=7]
  gt02.modem_at.recovery_full_queue:
    extra_configs: [CONFIG_AT_TEST_RECOVERY=y, CONFIG_AT_TEST_RECOVERY_CASE=8]
  gt02.modem_at.timeout:
    extra_configs:
      - CONFIG_AT_TEST_FAULT_CASE=0
  gt02.modem_at.partial_tx:
    extra_configs:
      - CONFIG_AT_TEST_FAULT_CASE=1
  gt02.modem_at.long_line:
    extra_configs:
      - CONFIG_AT_TEST_FAULT_CASE=2
  gt02.modem_at.long_body:
    extra_configs:
      - CONFIG_AT_TEST_FAULT_CASE=3
  gt02.modem_at.rx_error:
    extra_configs:
      - CONFIG_AT_TEST_FAULT_CASE=4
  gt02.modem_at.query_all:
    extra_configs:
      - CONFIG_AT_TEST_QUERY_ALL=y
      - CONFIG_AT_TEST_QUERY_FAULT_CASE=0
  gt02.modem_at.query_error_continue:
    extra_configs:
      - CONFIG_AT_TEST_QUERY_ALL=y
      - CONFIG_AT_TEST_QUERY_FAULT_CASE=1
  gt02.modem_at.query_timeout_stop:
    extra_configs:
      - CONFIG_AT_TEST_QUERY_ALL=y
      - CONFIG_AT_TEST_QUERY_FAULT_CASE=2
  gt02.modem_at.capability:
    extra_configs:
      - CONFIG_AT_TEST_CAPABILITY=y
  gt02.modem_at.network_registration_recovery:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=0
  gt02.modem_at.network_inactive_context:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=1
  gt02.modem_at.network_missing_ip:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=2
  gt02.modem_at.network_query_error:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=3
  gt02.modem_at.network_no_ready:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=4
  gt02.modem_at.network_duplicate_ready:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=5
  gt02.modem_at.network_at_timeout:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=6
  gt02.modem_at.network_stale_and_protection:
    extra_configs:
      - CONFIG_AT_TEST_NETWORK=y
      - CONFIG_AT_TEST_NETWORK_CASE=7
