# 启用Zephyr通用GPIO子系统，供后续LED、按键和控制引脚使用。
CONFIG_GPIO=y

# 启用printk()；主要用于极早期调试，正式模块优先使用LOG_xxx接口。
CONFIG_PRINTK=y
# 启用Zephyr日志子系统。
CONFIG_LOG=y
# 设置全局默认日志等级为3，即INFO；ERR、WRN和INF会被编译进固件。
CONFIG_LOG_DEFAULT_LEVEL=3

# 控制台和日志使用UART0：TX=P1.05、RX=P0.24，115200 8N1，无流控。
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# 六轴沿用现有自定义FIFO适配器，通过Zephyr I2C API访问LSM6DSO。
CONFIG_I2C=y
# 官方LSM6DSO驱动保持关闭，避免两个实现同时初始化同一颗IMU。
# 不需要为自定义FIFO适配器启用Sensor子系统。
# 若时钟校准等SDK组件需要SENSOR，让依赖自动选择，不强制设为n。
CONFIG_LSM6DSO=n

# 外部W25Q128JV使用官方SPI NOR驱动；从实际芯片读取SFDP参数。
# 驱动会在main()之前初始化；只读检查与破坏性自测由不同入口负责。
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
# 提供JEDEC ID和擦除块布局查询，保持旧工程4 KiB扇区语义。
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# Flash map为测试分区提供范围检查；与应用自测开关分别显式配置。
CONFIG_FLASH_MAP=y

# 用户已授权覆盖最后一个4 KiB扇区：0x00FFF000～0x00FFFFFF。
# 每次启动执行一轮有限擦写自测；会销毁该扇区原有数据！
# 验证完成后改为n并重新编译/烧录；不需要测试时不编译测试源文件。
CONFIG_GT02_FLASH_SELF_TEST=n

# 4G重建第一步：只启用GPIO/UART原始字节底座；不启动AT处理器或网络线程。
# PM设备能力供UART1显式启停使用，不启用系统PM或自动运行时挂起。
CONFIG_PM_DEVICE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GT02_MODEM_HW=y
CONFIG_GT02_MODEM_UART_RX_SIZE=2048
# 临时接口验证：首次上电后每10秒硬件下电/上电，UART0打印结果及4G原始URC。
# 验证结束后改为n；不发送AT，不启用TCP或Flash擦写自测。
CONFIG_GT02_MODEM_HW_TEST=y
# 保留当前日志缓冲容量；硬件底座本身不打印原始载荷。
CONFIG_LOG_BUFFER_SIZE=4096

# 主线程执行外设初始化、FIFO轮询和日志，预留4096字节栈。
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_SHOW_LEVEL=n
